name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install
          "numpy<3"
          "scipy<2"
          "pyqtgraph>=0.14,<0.15"
          "PySide6>=6.8,<7"
          "PyOpenGL>=3.1,<4"
      - name: Root suite
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Raw-capture suite
        run: python -m unittest discover -s rawdatacapture -p "test_*.py" -v
